// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    // Firebase Cloud Messaging (push notifications); applied in app/build.gradle when google-services.json exists.
    classpath('com.google.gms:google-services:4.4.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Older native libraries (e.g. @react-native-ml-kit/face-detection) don't declare
// an Android `namespace`, which AGP 8+ requires. Fill it in from their manifest.
subprojects { sub ->
  sub.plugins.withId('com.android.library') {
    if (sub.android.namespace == null) {
      def manifest = sub.file('src/main/AndroidManifest.xml')
      if (manifest.exists()) {
        def pkg = new groovy.xml.XmlSlurper().parse(manifest).@package.text()
        if (pkg) sub.android.namespace = pkg
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
